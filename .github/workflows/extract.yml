name: Extract Tree Zip

on:
  workflow_dispatch:
    inputs:
      ZIP_NAME:
        description: 'Nama zip di root repo'
        required: true
        default: 'ofox_a02_64bit_tree.zip'
      DELETE_ZIP:
        description: 'Hapus zip setelah diekstrak'
        required: true
        type: boolean
        default: true

jobs:
  extract:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract zip ke root repo
      run: |
        ZIP="${{ inputs.ZIP_NAME }}"
        [ -f "$ZIP" ] || { echo "::error::$ZIP tidak ada di root repo"; exit 1; }
        # .github/ di-skip: GITHUB_TOKEN tidak boleh push file workflow
        unzip -o "$ZIP" -x ".github/*" "__MACOSX/*"
        if [ "${{ inputs.DELETE_ZIP }}" = "true" ]; then rm -f "$ZIP"; fi
        git status --short | head -50

    - name: Commit & push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        if git diff --cached --quiet; then
          echo "Tidak ada perubahan."
        else
          git commit -m "Extract ${{ inputs.ZIP_NAME }}"
          git push
        fi
