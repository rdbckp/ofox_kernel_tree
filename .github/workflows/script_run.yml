name: Run build_ofox.sh

on:
  workflow_dispatch:
    inputs:
      FOX_BRANCH:
        description: 'Branch OrangeFox (yang sudah dites: 12.1)'
        type: choice
        required: true
        default: '12.1'
        options:
          - '12.1'
          - '11.0'
          - '14.1'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free disk space
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: true

    - name: Siapin folder build di /mnt
      run: |
        sudo mkdir -p /mnt/OrangeFox
        sudo chown "$USER":"$USER" /mnt/OrangeFox
        df -h /mnt /

    - name: Jalanin build_ofox.sh
      env:
        FOX_BRANCH: ${{ inputs.FOX_BRANCH }}
        FOX_DIR: /mnt/OrangeFox/${{ inputs.FOX_BRANCH }}
      run: |
        chmod +x build_ofox.sh
        ./build_ofox.sh

    - name: Upload OrangeFox
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-A02-64bit-${{ inputs.FOX_BRANCH }}
        path: OrangeFox-a02-new.img
        if-no-files-found: error

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ inputs.FOX_BRANCH }}
        path: /home/runner/build_ofox.log
        if-no-files-found: ignore
