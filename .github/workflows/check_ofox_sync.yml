name: Check OrangeFox Sync (detect only)

on:
  workflow_dispatch:
    inputs:
      FOX_BRANCH:
        description: 'Branch OrangeFox yang dicek'
        required: true
        default: '12.1'

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
    - name: Clone sync repo
      run: |
        git clone --depth=1 https://gitlab.com/OrangeFox/sync.git "$HOME/fox-sync"
        ls -la "$HOME/fox-sync"

    - name: Branch yang didukung script sync
      run: |
        cd "$HOME/fox-sync"
        ./orangefox_sync.sh --help || true

    - name: Cek branch diterima script
      run: |
        cd "$HOME/fox-sync"
        if ./orangefox_sync.sh --help 2>&1 | grep -qE "^\s+${{ inputs.FOX_BRANCH }}( |$)"; then
          echo "OK: branch ${{ inputs.FOX_BRANCH }} didukung script sync"
        else
          echo "::error::Branch ${{ inputs.FOX_BRANCH }} TIDAK ada di daftar script sync"; exit 1
        fi

    - name: URL repo yang dipakai script
      run: |
        cd "$HOME/fox-sync"
        grep -rhoE "https?://[A-Za-z0-9./_:-]+" --include="*.sh" . | sort -u | tee "$HOME/urls.txt"

    - name: Cek tiap repo ada atau tidak (ls-remote)
      run: |
        echo "| URL | Status |"
        while read -r u; do
          case "$u" in *.git|*gitlab.com/OrangeFox/*|*github.com/*) ;; *) continue ;; esac
          if timeout 30 git ls-remote --heads "$u" > /tmp/heads.txt 2>/dev/null; then
            echo "ADA     $u  ($(wc -l < /tmp/heads.txt) branch)"
            awk '{print "          - "$2}' /tmp/heads.txt | sed 's#refs/heads/##' | head -15
          else
            echo "TIDAK   $u"
          fi
        done < "$HOME/urls.txt"

    - name: Cek repo inti OrangeFox
      run: |
        for u in \
          https://gitlab.com/OrangeFox/Manifest.git \
          https://gitlab.com/OrangeFox/sync.git \
          https://gitlab.com/OrangeFox/vendor/recovery.git \
          https://gitlab.com/OrangeFox/bootable/Recovery.git \
          https://gitlab.com/OrangeFox/misc/theme.git ; do
          echo "== $u"
          timeout 30 git ls-remote --heads "$u" 2>&1 | awk '{print $2}' | sed 's#refs/heads/##' || echo "TIDAK ADA / tidak bisa diakses"
        done
